services:
  # ===========================
  # Database (MySQL 8.0)
  # ===========================
  db:
    image: mysql:8.0
    container_name: wp_lab_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123!          # Ganti sesuai keinginan
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: wppass123!
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - wp_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpass123!"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ===========================
  # WordPress (latest)
  # ===========================
  wordpress:
    image: wordpress:latest
    container_name: wp_lab_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "50080:80"                                # 🔥 Port uncommon (>50000)
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wordpress
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: wppass123!
      # WP-Cron dipicu oleh worker internal di bawah, bukan oleh request web.
      WORDPRESS_CONFIG_EXTRA: |
        define( 'DISABLE_WP_CRON', true );
    volumes:
      - wp_data:/var/www/html
      # Mode upload ZIP: plugin dikelola oleh WordPress di dalam wp_data.
      # Untuk mode development source lokal, aktifkan bind mount berikut
      # dan jangan melakukan update plugin dari WordPress Admin.
      # - ./:/var/www/html/wp-content/plugins/wp-root-guard
    networks:
      - wp_network

  # ===========================
  # WP-Cron worker (local lab)
  # ===========================
  # Memanggil WordPress melalui DNS internal Docker. Ini menghindari
  # kegagalan loopback ke localhost:50080 dari dalam container wordpress.
  wp-cron:
    image: curlimages/curl:8.10.1
    container_name: wp_lab_cron
    restart: unless-stopped
    depends_on:
      wordpress:
        condition: service_started
    networks:
      - wp_network
    entrypoint: ["/bin/sh", "-c"]
    command:
      - 'while true; do curl -fsS "http://wordpress/wp-cron.php" >/dev/null || true; sleep 60; done'

  # ===========================
  # Adminer (manajemen DB ringan)
  # ===========================
  adminer:
    image: adminer:latest
    container_name: wp_lab_adminer
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "50081:8080"                              # 🔥 Port uncommon untuk Adminer
    networks:
      - wp_network

# ===========================
# Volume Persisten
# ===========================
volumes:
  db_data:
    driver: local
  wp_data:
    driver: local

# ===========================
# Network Internal
# ===========================
networks:
  wp_network:
    driver: bridge
